{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rajal Maharjan — Data Science & Django{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
      /* Design Tokens & Theme Variables */
      :root {
        --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        --font-heading: 'Sora', system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;

        --bg-canvas: #090d16;
        --bg-surface: #111726;
        --bg-surface-elevated: #171f33;
        --border-subtle: #1f293d;
        --border-strong: #334155;
        
        --text-primary: #f8fafc;
        --text-secondary: #94a3b8;
        --text-muted: #64748b;

        --accent-primary: #3b82f6;
        --accent-primary-hover: #2563eb;
        --accent-emerald: #10b981;
        
        --radius-sm: 6px;
        --radius-md: 10px;
        --radius-lg: 16px;
        --radius-xl: 24px;
        --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.5);
      }

      [data-theme="light"] {
        --bg-canvas: #f8fafc;
        --bg-surface: #ffffff;
        --bg-surface-elevated: #f1f5f9;
        --border-subtle: #e2e8f0;
        --border-strong: #cbd5e1;
        --text-primary: #0f172a;
        --text-secondary: #475569;
        --text-muted: #64748b;
        --accent-primary: #2563eb;
        --accent-primary-hover: #1d4ed8;
        --shadow-card: 0 4px 20px -2px rgba(0, 0, 0, 0.06);
      }

      /* Base Reset */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html { scroll-behavior: smooth; scroll-padding-top: 84px; }
      body {
        font-family: var(--font-sans);
        background-color: var(--bg-canvas);
        color: var(--text-primary);
        line-height: 1.6;
        transition: background-color 0.2s ease, color 0.2s ease;
        -webkit-font-smoothing: antialiased;
      }

      h1, h2, h3, h4 {
        font-family: var(--font-heading);
        font-weight: 700;
        line-height: 1.15;
        color: var(--text-primary);
        letter-spacing: -0.02em;
      }

      a { color: inherit; text-decoration: none; }

      .container {
        max-width: 1140px;
        margin: 0 auto;
        padding: 0 24px;
      }

      /* Header / Navbar */
      .header {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(17, 23, 38, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-subtle);
      }
      [data-theme="light"] .header {
        background: rgba(255, 255, 255, 0.85);
      }
      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 68px;
      }
      .brand-wordmark {
        font-family: var(--font-heading);
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-badge {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: var(--radius-sm);
        background: var(--bg-surface-elevated);
        border: 1px solid var(--border-subtle);
        color: var(--accent-primary);
      }
      .nav-links {
        display: flex;
        gap: 28px;
        font-size: 0.875rem;
        font-weight: 500;
      }
      .nav-link {
        color: var(--text-secondary);
        transition: color 0.15s ease;
      }
      .nav-link:hover { color: var(--accent-primary); }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        font-size: 0.875rem;
        font-weight: 600;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all 0.15s ease;
        border: 1px solid transparent;
      }
      .btn-primary {
        background: var(--accent-primary);
        color: #ffffff;
      }
      .btn-primary:hover {
        background: var(--accent-primary-hover);
        transform: translateY(-1px);
      }
      .btn-secondary {
        background: var(--bg-surface-elevated);
        border-color: var(--border-subtle);
        color: var(--text-primary);
      }
      .btn-secondary:hover {
        border-color: var(--border-strong);
        transform: translateY(-1px);
      }

      /* Hero Section */
      .hero {
        padding: 72px 0 48px;
      }
      .hero-tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        color: var(--accent-emerald);
        margin-bottom: 16px;
      }
      .hero-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent-emerald);
        box-shadow: 0 0 10px var(--accent-emerald);
      }
      .hero-title {
        font-size: clamp(2.5rem, 5vw, 3.75rem);
        max-width: 20ch;
        margin-bottom: 20px;
      }
      .hero-desc {
        font-size: 1.125rem;
        color: var(--text-secondary);
        max-width: 65ch;
        margin-bottom: 32px;
      }

      /* About */
      .about-text {
        color: var(--text-secondary);
        max-width: 65ch;
        margin-bottom: 16px;
      }

      /* Metric Strip */
      .metrics-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        padding: 24px;
        margin: 40px 0 64px;
      }
      .metric-num {
        font-family: var(--font-mono);
        font-size: 2rem;
        font-weight: 800;
        color: var(--text-primary);
      }
      .metric-label {
        font-size: 0.8rem;
        color: var(--text-muted);
        margin-top: 4px;
      }

      /* Section Headers */
      .section-header {
        border-bottom: 1px solid var(--border-subtle);
        padding-bottom: 18px;
        margin-bottom: 36px;
      }
      .section-title {
        font-size: 1.85rem;
      }
      .section-subtitle {
        font-size: 0.875rem;
        color: var(--text-muted);
        margin-top: 4px;
      }

      /* Project Cards Grid */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 380px));
        gap: 24px;
        margin-bottom: 64px;
      }
      .card {
        position: relative;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .card:hover {
        transform: translateY(-4px);
        border-color: var(--border-strong);
        box-shadow: var(--shadow-card);
      }
      .card-media {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
        display: block;
        background: var(--bg-surface-elevated);
        border-bottom: 1px solid var(--border-subtle);
      }
      .card-stretched-link {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .card-body a.btn {
        position: relative;
        z-index: 2;
      }
      .card-body {
        padding: 24px;
        display: flex;
        flex-direction: column;
        flex-grow: 1;
      }
      .card-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-bottom: 12px;
      }
      .card-meta-sep { opacity: 0.4; }
      .card-title {
        font-size: 1.25rem;
        margin-bottom: 10px;
      }
      .card-desc {
        font-size: 0.875rem;
        color: var(--text-secondary);
        margin-bottom: 20px;
        flex-grow: 1;
      }
      .tech-stack {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 20px;
      }
      .tech-tag {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        padding: 3px 8px;
        background: var(--bg-surface-elevated);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-sm);
        color: var(--text-secondary);
      }

      /* Footer */
      footer {
        border-top: 1px solid var(--border-subtle);
        padding: 36px 0;
        margin-top: 80px;
        font-size: 0.875rem;
        color: var(--text-muted);
      }
      .footer-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 16px;
      }
      .footer-links {
        display: flex;
        align-items: center;
        gap: 20px;
        flex-wrap: wrap;
      }
      .footer-links a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      /* Icons */
      .icon {
        width: 18px;
        height: 18px;
        fill: currentColor;
        flex-shrink: 0;
      }
    </style>
</head>
<body>

    <!-- Icon sprite: use with <svg class="icon"><use href="#icon-github"/></svg> -->
    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden;">
      <symbol id="icon-github" viewBox="0 0 24 24">

      </symbol>
      <symbol id="icon-linkedin" viewBox="0 0 24 24">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </symbol>
      <symbol id="icon-mail" viewBox="0 0 24 24">
        <rect x="2" y="4" width="20" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="m22 7-10 6L2 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
    </svg>

    <header class="header">
      <div class="container header-inner">
        <a href="#hero" class="brand-wordmark">
          Rajal Maharjan
          <span class="brand-badge">Data Science · Django</span>
        </a>
        <nav class="nav-links">
          <a href="#about" class="nav-link">About</a>
          <a href="#projects" class="nav-link">Projects</a>
          <a href="#contact" class="nav-link">Contact</a>
        </nav>
        <div style="display: flex; gap: 12px; align-items: center;">
          <button id="theme-toggle" class="btn btn-secondary" style="padding: 8px 12px;" title="Toggle Theme">🌓</button>
          <a href="mailto:maharjanrajal22@gmail.com" class="btn btn-primary">Hire Me</a>
        </div>
      </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
      <div class="container footer-inner">
        <div>
          <strong style="color: var(--text-primary);">Rajal Maharjan</strong> · Data Science &amp; Django Specialist
        </div>
        <div class="footer-links">
          <a href="https://github.com/Rajal22" target="_blank" rel="noopener" class="nav-link">
            <svg class="icon"><use href="#icon-github"/></svg> GitHub
          </a>
          <a href="https://www.linkedin.com/in/rajal-maharjan-8b24b03aa" target="_blank" rel="noopener" class="nav-link">
            <svg class="icon"><use href="#icon-linkedin"/></svg> LinkedIn
          </a>
          <a href="mailto:maharjanrajal22@gmail.com" class="nav-link">
            <svg class="icon"><use href="#icon-mail"/></svg> Email
          </a>
          <span>&copy; {% now "Y" %} Rajal Maharjan</span>
        </div>
      </div>
    </footer>

    <script>
      // Theme Toggle logic
      const btn = document.getElementById('theme-toggle');
      if (btn) {
        btn.addEventListener('click', () => {
          const current = document.documentElement.getAttribute('data-theme');
          const target = current === 'light' ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', target);
        });
      }
    </script>
</body>
</html>
